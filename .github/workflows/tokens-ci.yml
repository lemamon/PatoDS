# Tokens CI (skeleton). All actions are pinned by SHA digest (ENG-18).
# The SHAs below are placeholders; the CI and governance feature pins the real digests.
#
# Install uses `pnpm ci:install`: a frozen install of the buildable packages, then `pack:tokens`
# to generate the published tarball, then a full frozen install so the apps/tests consume the
# packed artifact rather than the workspace source (QA-06, Principle VII). The tarball is
# git-ignored, so a plain `pnpm install --frozen-lockfile` cannot resolve the apps' file: deps.
name: tokens-ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly: all Playwright engines + determinism (QA-12).
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: tokens-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor (current premise: Node on LTS) and latest (ENG-08).
        node: ["22", "24"]
    steps:
      # actions/checkout@v5 - pin by SHA digest in the CI feature
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # actions/setup-node@v4 - pin by SHA digest
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm ci:install
      - run: pnpm check:layers
      - run: pnpm check:traceability
      - run: pnpm check:logic-tests
      - run: pnpm check:scan
      - run: pnpm tokens:validate
      - run: pnpm tokens:build
      - run: pnpm contrast:check
      - run: pnpm lint:styles
      # Deliberate violation (constitution, "Traceability and acceptance"; lint-rules.md §6): the gate-probe
      # starts with `/* stylelint-disable */` and contains a literal; with --ignore-disables it must still
      # fail. A zero exit here means the gate stopped blocking.
      - name: lint:styles gate-probe (deliberate violation must fail)
        run: |
          if pnpm exec stylelint "tools/stylelint-plugin/fixtures/gate-probe/probe.css" \
            --config stylelint.config.mjs --ignore-disables --max-warnings 0; then
            echo "gate-probe did not fail; the style gate is not blocking"; exit 1
          else
            echo "gate-probe correctly blocked (ignore-disables honoured)"
          fi
      - run: pnpm test
      - run: pnpm test:types
      - run: pnpm check:drift

  e2e:
    # Chromium on every PR (QA-12); all engines run in the nightly job below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:<digest>
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm ci:install
      - run: pnpm test:e2e -- --project=chromium

  nightly-e2e:
    # All engines (Chromium, Firefox, WebKit) on main and on the nightly schedule (QA-12).
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:<digest>
    env:
      E2E_ALL_ENGINES: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm ci:install
      - run: pnpm test:e2e

  nightly-determinism:
    # Byte-for-byte reproducible build (SC-007) plus the contrast report over the real manifest,
    # across the Node floor and latest (T062), on main and on the nightly schedule.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm ci:install
      - run: pnpm check:determinism
      - run: pnpm contrast:check
