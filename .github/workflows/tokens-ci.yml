# Tokens CI (skeleton). All actions are pinned by SHA digest (ENG-18).
# The SHAs below are placeholders; the CI and governance feature pins the real digests.
name: tokens-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tokens-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor (current premise: Node on LTS) and latest (ENG-08).
        node: ["22", "24"]
    steps:
      # actions/checkout@v5 - pin by SHA digest in the CI feature
      - uses: actions/checkout@<sha>
      # actions/setup-node@v4 - pin by SHA digest
      - uses: actions/setup-node@<sha>
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:layers
      - run: pnpm check:scan
      - run: pnpm tokens:validate
      - run: pnpm tokens:build
      - run: pnpm contrast:check
      - run: pnpm lint:styles
      - run: pnpm test
      - run: pnpm test:types
      - run: pnpm check:drift

  e2e:
    runs-on: ubuntu-latest
    # On PRs only Chromium runs; the nightly (separate workflow) runs all engines (QA-12).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:<digest>
    steps:
      - uses: actions/checkout@<sha>
      - uses: actions/setup-node@<sha>
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e -- --project=chromium

  nightly-determinism:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<sha>
      - uses: actions/setup-node@<sha>
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:determinism
